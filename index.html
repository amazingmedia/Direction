<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Timeframe Market Bias Analyzer</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --card-hover: #334155;
            --text: #f8fafc;
            --muted: #94a3b8;
            --bull-color: #10b981;
            --bear-color: #ef4444;
            --border: #334155;
            --primary: #3b82f6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden; 
        }

        .app-container {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 1250px;
            height: 100%;
            max-height: 94vh; 
        }

        /* Sidebar */
        .sidebar {
            width: 330px;
            flex-shrink: 0;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .sidebar-header {
            padding: 15px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.2);
        }

        .sidebar-header h3 { margin: 0; font-size: 1.05rem; color: var(--primary); }

        .edit-btn {
            background: transparent; color: var(--muted); border: 1px solid var(--border);
            padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; transition: 0.2s;
        }

        .edit-btn:hover { border-color: var(--primary); color: var(--text); }

        .points-menu {
            flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px;
        }

        .points-menu::-webkit-scrollbar { width: 6px; }
        .points-menu::-webkit-scrollbar-track { background: transparent; }
        .points-menu::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

        .menu-item {
            padding: 12px 15px; background: var(--bg); border: 1px solid var(--border);
            border-radius: 8px; cursor: pointer; font-size: 0.88rem; line-height: 1.4;
            transition: all 0.2s; display: flex; align-items: flex-start; gap: 10px;
        }

        .menu-item:hover { border-color: var(--muted); background: var(--card-hover); transform: translateX(4px); }
        .menu-item::before { content: '🔍'; font-size: 0.85rem; }

        /* Main Content */
        .main-content {
            flex: 1; display: flex; flex-direction: column; gap: 12px; min-height: 0;
        }

        .header-title { margin: 0 0 4px 0; color: var(--text); font-size: 1.4rem; }
        
        /* Timeframe Tabs */
        .tf-selector {
            display: flex; gap: 8px; margin-bottom: 5px;
        }
        
        .tf-btn {
            background: var(--card); border: 1px solid var(--border); color: var(--muted);
            padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s;
        }

        .tf-btn.active {
            background: var(--primary); color: white; border-color: var(--primary);
        }

        .columns-wrapper { display: flex; gap: 15px; flex: 1; min-height: 0; }

        .column {
            flex: 1; padding: 15px; border-radius: 12px; background: var(--card);
            border: 2px solid var(--border); cursor: pointer; display: flex; flex-direction: column;
            transition: 0.3s; min-height: 0;
        }

        .col-title {
            font-size: 1.05rem; font-weight: bold; margin-bottom: 12px; display: flex;
            justify-content: space-between; align-items: center; flex-shrink: 0;
        }

        .column.active-bull { border-color: var(--bull-color); background: rgba(16, 185, 129, 0.04); }
        .column.active-bear { border-color: var(--bear-color); background: rgba(239, 68, 68, 0.04); }

        .items-list { flex: 1; overflow-y: auto; padding-right: 5px; }
        .items-list::-webkit-scrollbar { width: 4px; }
        .items-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }

        .selected-item {
            padding: 10px 12px; margin-bottom: 8px; border-radius: 6px; background: rgba(0,0,0,0.4);
            cursor: pointer; font-size: 0.88rem; display: flex; align-items: flex-start; gap: 10px; line-height: 1.4;
        }

        .selected-item:hover { text-decoration: line-through; opacity: 0.7; }
        .bull-item { border-left: 4px solid var(--bull-color); }
        .bear-item { border-left: 4px solid var(--bear-color); }

        .score { background: rgba(255,255,255,0.1); padding: 2px 10px; border-radius: 10px; font-size: 0.85rem; }

        #result {
            padding: 12px 20px; border-radius: 12px; font-size: 1.05rem; font-weight: bold;
            text-align: center; background: var(--card); border: 1px solid var(--border); flex-shrink: 0;
        }

        /* Modal Styles */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 100;
        }

        .modal-content {
            background: var(--card); padding: 20px; border-radius: 12px; width: 90%; max-width: 600px;
        }

        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .modal-header h3 { margin: 0; color: var(--primary); }

        .import-export-btns { display: flex; gap: 10px; }
        .btn-ie { background: #334155; color: var(--text); border: 1px solid var(--border); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem;}

        textarea {
            width: 100%; height: 250px; background: var(--bg); color: var(--text);
            border: 1px solid var(--border); padding: 12px; border-radius: 8px;
            font-size: 0.95rem; box-sizing: border-box; resize: vertical; line-height: 1.5;
        }

        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 15px; }
        .btn-save { background: var(--primary); color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
        .btn-cancel { background: transparent; color: var(--text); border: 1px solid var(--border); padding: 8px 16px; border-radius: 6px; cursor: pointer; }

        @media (max-width: 768px) {
            body { height: auto; overflow: auto; }
            .app-container { flex-direction: column; height: auto; max-height: none; }
            .sidebar { width: 100%; height: 280px; }
            .columns-wrapper { flex-direction: column; }
            .column { min-height: 220px; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h3>📋 မူဘောင် အချက်အလက်များ</h3>
                <button class="edit-btn" onclick="openModal()">⚙️ ပြင်ဆင်ရန်</button>
            </div>
            <div class="points-menu" id="points-bank"></div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div>
                <h2 class="header-title">Market Structure & Direction Bias Analyzer</h2>
                
                <!-- Timeframe Selection Tabs -->
                <div class="tf-selector">
                    <button class="tf-btn active" onclick="changeTF('4H')">4H</button>
                    <button class="tf-btn" onclick="changeTF('1H')">1H</button>
                    <button class="tf-btn" onclick="changeTF('15M')">15M</button>
                    <button class="tf-btn" onclick="changeTF('5M')">5M</button>
                </div>
            </div>

            <!-- Columns -->
            <div class="columns-wrapper">
                <div class="column active-bull" id="col-bull" onclick="setTarget('bull')">
                    <div class="col-title" style="color: var(--bull-color);">
                        <span id="title-bull">📈 (4H) စျေးတက်နိုင်သည့် အချက်များ</span>
                        <span class="score" id="score-bull">0</span>
                    </div>
                    <div class="items-list" id="list-bull"></div>
                </div>

                <div class="column" id="col-bear" onclick="setTarget('bear')">
                    <div class="col-title" style="color: var(--bear-color);">
                        <span id="title-bear">📉 (4H) စျေးကျနိုင်သည့် အချက်များ</span>
                        <span class="score" id="score-bear">0</span>
                    </div>
                    <div class="items-list" id="list-bear"></div>
                </div>
            </div>

            <div id="result">အချက်အလက်များကို ရွေးချယ်ပါ</div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal-overlay" id="edit-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>အချက်အလက်များ ပြင်ဆင်ရန်</h3>
                <div class="import-export-btns">
                    <input type="file" id="file-import" accept=".txt" style="display: none;" onchange="importFile(event)">
                    <button class="btn-ie" onclick="document.getElementById('file-import').click()">📤 Import</button>
                    <button class="btn-ie" onclick="exportFile()">📥 Export</button>
                </div>
            </div>
            <p style="font-size:0.8rem; color:var(--muted); margin-top:0;">(တစ်ကြောင်းလျှင် အချက်တစ်ချက် ရေးပါ။ မူဘောင်အလိုက် Analysis ပြုလုပ်နိုင်ပါသည်။)</p>
            
            <textarea id="points-textarea"></textarea>
            
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal()">Cancel</button>
                <button class="btn-save" onclick="savePoints()">Save Changes</button>
            </div>
        </div>
    </div>

    <script>
        const defaultPoints = [
"Keyzone ဖေါက်ထွက် ထားတယ်။",
"Downtrend ဖြစ်ပေမယ့် LL to LH",
"Uptrend ဖြစ်ပေမယ့် HH to HL"
 
        ];

        let allPoints = [];
        let currentTF = '4H';
        let currentTarget = 'bull';
        
        let tfSelections = {
            '4H': {},
            '1H': {},
            '15M': {},
            '5M': {}
        };

        function loadInitialData() {
            const savedData = localStorage.getItem('marketAnalyzerPoints');
            if (savedData) {
                allPoints = JSON.parse(savedData);
            } else {
                allPoints = [...defaultPoints];
            }
            render();
        }

        function changeTF(tf) {
            currentTF = tf;
            document.querySelectorAll('.tf-btn').forEach(btn => {
                btn.classList.toggle('active', btn.textContent === tf);
            });
            render();
        }

        function setTarget(target) {
            currentTarget = target;
            document.getElementById('col-bull').classList.toggle('active-bull', target === 'bull');
            document.getElementById('col-bear').classList.toggle('active-bear', target === 'bear');
        }

        function togglePoint(index) {
            const currentObj = tfSelections[currentTF];
            if (currentObj[index]) {
                delete currentObj[index];
            } else {
                currentObj[index] = currentTarget;
            }
            render();
        }

        function render() {
            // Update Titles dynamically with current Timeframe
            document.getElementById('title-bull').textContent = `📈 (${currentTF}) စျေးတက်နိုင်သည့် အချက်များ`;
            document.getElementById('title-bear').textContent = `📉 (${currentTF}) စျေးကျနိုင်သည့် အချက်များ`;

            const bank = document.getElementById('points-bank');
            const listBull = document.getElementById('list-bull');
            const listBear = document.getElementById('list-bear');
            
            bank.innerHTML = ''; listBull.innerHTML = ''; listBear.innerHTML = '';
            
            const currentObj = tfSelections[currentTF];
            let bullCount = 0; let bearCount = 0;

            allPoints.forEach((point, index) => {
                if (!currentObj[index]) {
                    const btn = document.createElement('div');
                    btn.className = 'menu-item';
                    btn.textContent = point;
                    btn.onclick = () => togglePoint(index);
                    bank.appendChild(btn);
                } else {
                    const item = document.createElement('div');
                    const isBull = currentObj[index] === 'bull';
                    item.className = `selected-item ${isBull ? 'bull-item' : 'bear-item'}`;
                    item.innerHTML = `<span style="font-size:0.8rem; margin-top:2px;">✖</span> <span>${point}</span>`;
                    item.onclick = (e) => { e.stopPropagation(); togglePoint(index); };

                    if (isBull) { listBull.appendChild(item); bullCount++; } 
                    else { listBear.appendChild(item); bearCount++; }
                }
            });

            document.getElementById('score-bull').textContent = bullCount;
            document.getElementById('score-bear').textContent = bearCount;

            const res = document.getElementById('result');
            if (bullCount === 0 && bearCount === 0) {
                res.textContent = `[${currentTF}] အချက်အလက်များကို ရွေးချယ်ပါ`;
                res.style.background = "var(--card)"; res.style.color = "var(--muted)"; res.style.borderColor = "var(--border)";
            } else if (bullCount > bearCount) {
                res.textContent = `[${currentTF}] စျေးတက်နိုင်သည့် အလားအလာ ပိုများနေပါသည် (Bullish Bias Focus)`;
                res.style.background = "rgba(16, 185, 129, 0.15)"; res.style.color = "var(--bull-color)"; res.style.borderColor = "var(--bull-color)";
            } else if (bearCount > bullCount) {
                res.textContent = `[${currentTF}] စျေးကျနိုင်သည့် အလားအလာ ပိုများနေပါသည် (Bearish Bias Focus)`;
                res.style.background = "rgba(239, 68, 68, 0.15)"; res.style.color = "var(--bear-color)"; res.style.borderColor = "var(--bear-color)";
            } else {
                res.textContent = `[${currentTF}] တက်/ကျ အားပြိုင်နေပါသည် (Consolidation / Neutral)`;
                res.style.background = "rgba(251, 191, 36, 0.15)"; res.style.color = "#fbbf24"; res.style.borderColor = "#fbbf24";
            }
        }

        // Modal Controls
        function openModal() {
            document.getElementById('points-textarea').value = allPoints.join('\n');
            document.getElementById('edit-modal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('edit-modal').style.display = 'none'; }

        function savePoints() {
            const rawText = document.getElementById('points-textarea').value;
            allPoints = rawText.split('\n').map(line => line.trim()).filter(line => line !== '');
            
            localStorage.setItem('marketAnalyzerPoints', JSON.stringify(allPoints));
            
            tfSelections = { '4H': {}, '1H': {}, '15M': {}, '5M': {} };
            render();
            closeModal();
        }

        function exportFile() {
            const currentData = document.getElementById('points-textarea').value;
            if(!currentData.trim()) return alert("Export လုပ်ရန် အချက်အလက် မရှိပါ။");
            
            const blob = new Blob([currentData], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'Market_Analysis_Rules.txt';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function importFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('points-textarea').value = e.target.result;
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        loadInitialData();
    </script>
</body>
</html>
